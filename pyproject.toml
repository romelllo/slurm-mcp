[project]
name = "slurm-mcp"
version = "0.1.0"
description = "MCP server that lets Claude Code (and other MCP clients) work on any SLURM HPC cluster over SSH"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "slurm", "hpc", "ssh", "claude", "claude-code"]
dependencies = [
    "mcp>=2.3.0,<3",
    "asyncssh>=2.14.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
slurm-mcp = "slurm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slurm_mcp"]

# ── Development dependencies ───────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a6",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["slurm_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty (type checker) ─────────────────────────────────────────────────────────
[tool.ty]
environment = { python-version = "3.11" }

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
